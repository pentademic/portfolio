<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Architecture distribuée M2S</title>
  <desc id="desc">Un nœud maître STM32F746G-DISCO coordonne la vision, les nœuds de distribution, le RFID et les liaisons externes.</desc>
